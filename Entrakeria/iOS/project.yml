name: Entrakeria
options:
  bundleIdPrefix: com.portokali
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  Entrakeria:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Colors.swift
      - TetradGeometry.swift
      - Models.swift
      - ContentView.swift
      - EntrekeriaApp.swift
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Entrakeria
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portokali.Entrakeria
        TARGETED_DEVICE_FAMILY: "1"
